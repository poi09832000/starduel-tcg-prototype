<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星域對決｜集換式卡牌桌遊原型</title>
  <style>
    :root { --ink:#f6f0dc; --muted:#b9b096; --line:rgba(246,240,220,.2); --panel:rgba(17,26,39,.84); --gold:#f1bd55; --red:#d85a68; --blue:#4da7d8; --green:#69bb88; --table:#142f2b; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; color:var(--ink); font-family:system-ui,"Microsoft JhengHei",sans-serif; background:radial-gradient(circle at 50% 32%,#315447 0,#142621 42%,#0b1118 100%); }
    button { font:inherit; cursor:pointer; }
    .app { max-width:1440px; min-height:100vh; margin:auto; padding:20px; display:grid; grid-template-columns:270px 1fr; gap:20px; }
    .sidebar,.player,.card,.zone,.log { border:1px solid var(--line); background:var(--panel); box-shadow:0 12px 30px rgba(0,0,0,.25); }
    .sidebar { border-radius:18px; padding:22px; align-self:start; }
    h1 { font-size:25px; line-height:1.15; margin:0 0 8px; letter-spacing:.08em; }
    h2 { font-size:16px; margin:0 0 12px; color:var(--gold); }
    .subtitle,.rule-list,.meta { color:var(--muted); font-size:13px; line-height:1.55; }
    .rule-list { padding-left:19px; margin:8px 0 24px; }
    .pill { display:inline-block; padding:4px 9px; border:1px solid rgba(241,189,85,.45); color:var(--gold); border-radius:99px; font-size:12px; }
    .board { display:grid; gap:14px; min-width:0; }
    .player { display:grid; grid-template-columns:200px 1fr; gap:16px; padding:16px; border-radius:16px; }
    .player.enemy { background:rgba(34,25,40,.84); }
    .player-info { display:flex; flex-direction:column; gap:10px; }
    .name-row { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .name { font-weight:700; }
    .health { font-weight:800; font-variant-numeric:tabular-nums; color:#fff; }
    .meter { height:9px; background:rgba(255,255,255,.12); border-radius:99px; overflow:hidden; }
    .meter > span { display:block; height:100%; background:linear-gradient(90deg,var(--red),#f28c75); transition:width .25s; }
    .resources { display:flex; align-items:center; gap:6px; font-size:13px; }
    .gem { width:13px; height:13px; background:var(--blue); transform:rotate(45deg); display:inline-block; border-radius:2px; }
    .card-row { display:flex; flex-wrap:wrap; gap:10px; align-content:center; min-height:122px; }
    .card { position:relative; width:100px; height:142px; padding:9px; border-radius:10px; overflow:hidden; background:linear-gradient(145deg,#264665,#152139 70%); text-align:left; color:var(--ink); }
    .card:hover { transform:translateY(-4px); border-color:var(--gold); }
    .card.type-unit { background:linear-gradient(145deg,#35604e,#152d29 70%); }
    .card.type-spell { background:linear-gradient(145deg,#514078,#211c40 70%); }
    .cost { position:absolute; right:8px; top:7px; font-size:18px; color:#ccefff; font-weight:800; }
